<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro" title="Cambiar a modo claro">🌙</button>

    <header class="game-header">
      <h1 class="game-title">TETRIS</h1>
      <p class="game-subtitle">Encaja las piezas, completa líneas y consigue la máxima puntuación</p>
    </header>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay start-screen">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <p class="records-heading">MEJORES PUNTUACIONES</p>
        <div id="start-records" class="records-panel"></div>
        <button id="play-btn" class="records-btn-primary" type="button">Jugar</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="record-highlight" class="record-highlight records-only hidden"></p>
        <form id="record-form" class="record-form records-only hidden" autocomplete="off">
          <label for="record-name" class="label">TU NOMBRE</label>
          <div class="record-form-row">
            <input id="record-name" type="text" maxlength="12" placeholder="Jugador" spellcheck="false" />
            <button id="record-save-btn" type="submit" class="records-btn-secondary">Guardar</button>
          </div>
        </form>
        <div id="gameover-records" class="records-panel records-only"></div>
        <div class="overlay-actions">
          <button id="restart-btn">Reiniciar</button>
          <button id="reset-records-btn" class="records-btn-secondary records-only" type="button">Borrar records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
